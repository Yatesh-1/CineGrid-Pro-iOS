name: Build iOS IPA (CineGrid Pro)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Xcode Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build and Archive iOS App
        run: |
          mkdir -p build release/ios
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.build_configuration }} \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -y ../release/ios/CineGrid-Pro-v1.0.0.ipa Payload
          cd ..
          ls -lh release/ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineGrid-Pro-iOS-IPA
          path: release/ios/CineGrid-Pro-v1.0.0.ipa
          retention-days: 14
